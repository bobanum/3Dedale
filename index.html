<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3Dedale – Maze Test</title>
    <link rel="stylesheet" href="./css/test-page.css">
</head>
<body>
    <h1>3Dedale – Maze Test Page</h1>
    <p>Generate a maze from the requested size and inspect the rendered result.</p>

    <form id="mazeForm">
        <label>
            Width (columns)
            <input type="number" id="width" name="width" value="5" min="2" max="100" required>
        </label>
        <label>
            Height (rows)
            <input type="number" id="height" name="height" value="5" min="2" max="100" required>
        </label>
        <label>
            Depth (floors)
            <input type="number" id="depth" name="depth" value="1" min="1" max="20" required>
        </label>
        <button type="submit">Generate maze</button>
    </form>

    <section id="summary" aria-live="polite">
        <strong>Maze generated.</strong>
        <ul id="summaryList"></ul>
    </section>

    <section class="viewport" aria-label="3D maze viewport">
        <canvas id="mazeCanvas" width="1280" height="720"></canvas>
    </section>

    <pre id="output"></pre>

    <script type="module" src="./src/Point.js"></script>
    <script type="module" src="./src/Wall.js"></script>
    <script type="module" src="./src/Maze.js"></script>
    <script type="module" src="./src/Wanderer.js"></script>
    <script type="module" src="./src/AStarSolver.js"></script>
    <script type="module" src="./src/Renderer.js"></script>
    <script type="module" src="./src/app.js"></script>
</body>
</html>
